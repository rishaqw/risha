<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Outfit:wght@200;300;400&display=swap">
<style>
/* Layout concept: an infinite off-white grid board. Name sits at the origin; click zooms the
   camera out, six flowing stems draw outward, each stem unfolds frames. Photos grow into
   bigger frames on the same board instead of a lightbox. */
:root {
  --bg: #f3f2ee;
  --grid: #e8e6df;
  --grid-major: #dad7ce;
  --ink: #17171a;
  --muted: #74737a;
  --accent: #0c8ce9;
  --card: #fdfdfb;
  --border: #dedbd2;
  --line: #4a4950;
  --p0a: #d9e6f2; --p0b: #b9cfe6;
  --p1a: #f2ddd2; --p1b: #e5bfae;
  --p2a: #dbebd8; --p2b: #b9d5b4;
  --p3a: #e5dcf1; --p3b: #cbbbe3;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.06);
  --display: 'Outfit', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131317; --grid: #1b1b21; --grid-major: #282830; --ink: #f1f0ec; --muted: #9b9aa3;
    --accent: #4cb0ff; --card: #1c1c22; --border: #2f2f38; --line: #c4c3cb;
    --p0a: #26374a; --p0b: #34506b; --p1a: #4a3329; --p1b: #6b4838;
    --p2a: #2b4129; --p2b: #3d5e3a; --p3a: #3b2f49; --p3b: #54426a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131317; --grid: #1b1b21; --grid-major: #282830; --ink: #f1f0ec; --muted: #9b9aa3;
  --accent: #4cb0ff; --card: #1c1c22; --border: #2f2f38; --line: #c4c3cb;
  --p0a: #26374a; --p0b: #34506b; --p1a: #4a3329; --p1b: #6b4838;
  --p2a: #2b4129; --p2b: #3d5e3a; --p3a: #3b2f49; --p3b: #54426a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 300 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

#app { position: relative; height: 100%; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
}
#viewport.intro { cursor: default; }
#viewport.grabbing { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
#lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }

.stem, .conn {
  fill: none; stroke: var(--line); stroke-width: var(--sw, 1); stroke-linecap: butt;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset 1.2s cubic-bezier(.5, 0, .2, 1);
}
.stem.in, .conn.show { stroke-dashoffset: 0; }

#name {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 5;
  font: 200 60px/1 var(--display); letter-spacing: -.01em; white-space: nowrap;
  padding: 18px 40px 21px; border: 1px solid transparent; border-radius: 34px;
  background: transparent; color: var(--ink); cursor: pointer;
  transition: border-color .8s ease, background-color .8s ease;
}
#name.mapped { border-color: var(--ink); background: var(--bg); }

.node {
  position: absolute; z-index: 4; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
  font: 300 18px/1 var(--display); letter-spacing: .01em; white-space: nowrap;
  padding: 11px 23px 12px; border-radius: 999px; border: 1px solid var(--ink);
  background: var(--bg); color: var(--ink); cursor: pointer;
  transition: transform .7s cubic-bezier(.2, .9, .25, 1.1), opacity .5s ease, background-color .25s, color .25s;
}
.node.in { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.node.in:hover { transform: translate(-50%, -50%) scale(1.05); }
.node.open { background: var(--ink); color: var(--bg); }

.win {
  position: absolute; z-index: 3; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(.12);
  transition: transform .95s cubic-bezier(.2, .9, .25, 1), opacity .5s ease, box-shadow .2s ease;
}
.win.show { opacity: 1; transform: none; pointer-events: auto; }
.win:hover { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.win.sel { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.win.feat { border-color: var(--ink); }
.win .h { position: absolute; width: 7px; height: 7px; background: var(--card); border: 1px solid var(--accent); display: none; }
.win.sel .h { display: block; }
.h.a { left: -4px; top: -4px; } .h.b { right: -4px; top: -4px; } .h.c { left: -4px; bottom: -4px; } .h.d { right: -4px; bottom: -4px; }
.win .inner { height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 9px; }
.win .bar {
  flex: none; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px;
  border-bottom: 1px solid var(--border); cursor: grab; user-select: none; touch-action: none;
  font: 300 10px/1 var(--mono); letter-spacing: .03em; color: var(--muted);
}
.win .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.win .bar span { margin-left: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win .body { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; user-select: text; cursor: auto; }

/* window content */
.grid { flex: 1; min-height: 0; display: grid; gap: 5px; }
.ph { position: relative; border-radius: 5px; overflow: hidden; margin: 0; min-height: 0; }
.ph.p0 { background: linear-gradient(135deg, var(--p0a), var(--p0b)); }
.ph.p1 { background: linear-gradient(135deg, var(--p1a), var(--p1b)); }
.ph.p2 { background: linear-gradient(135deg, var(--p2a), var(--p2b)); }
.ph.p3 { background: linear-gradient(135deg, var(--p3a), var(--p3b)); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph .cap { position: absolute; left: 8px; bottom: 6px; font: 300 9.5px/1.2 var(--mono); color: var(--ink); opacity: .7; }
button.ph { border: 0; padding: 0; display: block; width: 100%; text-align: left; cursor: zoom-in; }
button.ph:hover { box-shadow: 0 0 0 1px var(--accent); }
.grid.ev { flex: none; height: 128px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
.grid.ev.four { grid-template-columns: repeat(2, 1fr); }
.artists { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.artist { height: 104px; }
.artist b { position: absolute; left: 10px; right: 8px; bottom: 9px; font: 300 22px/1.05 var(--display); color: var(--ink); }
.artist small { position: absolute; left: 10px; top: 9px; font: 300 8.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); opacity: .65; }
.strip { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; height: 44px; }
.video { flex: 1; display: grid; place-items: center; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; }
.play::after { content: ""; margin-left: 3px; border-left: 10px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
a.play:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.scrub { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 1px; background: color-mix(in srgb, var(--ink) 25%, transparent); }
.scrub i { display: block; width: 34%; height: 100%; background: var(--ink); }
.time { position: absolute; right: 10px; bottom: 16px; font: 300 9.5px/1 var(--mono); color: var(--ink); opacity: .7; }
.meta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex: none; }
.meta b { font: 400 14px/1.2 var(--display); }
.meta span { font: 300 10.5px/1.3 var(--mono); color: var(--muted); text-align: right; }
.posters { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.poster { border-radius: 3px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font: 300 22px/.95 var(--display); letter-spacing: -.02em; color: #17171a; }
.poster small { font: 400 8px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.swatches { display: flex; gap: 5px; flex: none; height: 60px; }
.swatches i { flex: 1; border-radius: 5px; }
.specimen { flex: 1; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); border-radius: 7px; padding: 0 16px; }
.specimen b { font: 200 64px/1 var(--display); }
.specimen div { font: 300 10.5px/1.6 var(--mono); color: var(--muted); }
.wire { flex: 1; display: grid; grid-template-columns: 70px 1fr; gap: 8px; min-height: 0; }
.wire > div { border: 1px dashed var(--border); border-radius: 5px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.wire i { display: block; height: 6px; border-radius: 3px; background: var(--border); }
.wire i.s { width: 60%; } .wire i.t { height: 34px; border-radius: 5px; background: linear-gradient(135deg, var(--p0a), var(--p0b)); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row b { font: 400 13px/1.3 var(--display); }
.row span { font: 300 10.5px/1.3 var(--mono); color: var(--muted); text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font: 300 10.5px/1 var(--mono); padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px; }
.log { font: 300 10.5px/1.8 var(--mono); color: var(--muted); }
.log b { color: var(--ink); font-weight: 400; }
.prose p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; }
.prose p:last-child { margin: 0; }
.kick { font: 300 9.5px/1.5 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex: none; }
.ttl { font: 300 21px/1.15 var(--display); flex: none; }
.ttl.sm { font-size: 18px; }
.ttl.lg { font-size: 28px; line-height: 1.05; }
.sub { font: 300 11.5px/1.4 var(--body); color: var(--muted); flex: none; }
.gear { font: 300 10px/1.5 var(--mono); color: var(--muted); flex: none; }
.album { margin-top: auto; align-self: flex-start; font: 400 10.5px/1.4 var(--mono); color: var(--ink); text-decoration: none; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 0 0 1px; cursor: pointer; }
.album:hover { color: var(--accent); border-color: var(--accent); }
.album.soon { color: var(--muted); border-bottom: 0; cursor: default; }
.about-head { display: flex; gap: 12px; align-items: center; flex: none; }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--p1a), var(--p3b)); flex: none; object-fit: cover; }
.about-head b { display: block; font: 300 24px/1.1 var(--display); }
.about-head span { font: 300 10.5px/1.4 var(--mono); color: var(--muted); }
.mail { font: 300 24px/1.15 var(--display); overflow-wrap: anywhere; }
.copy { align-self: flex-start; font: 400 10.5px/1 var(--mono); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.copy:hover { background: var(--ink); color: var(--bg); }
.links a { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink); text-decoration: none; padding: 11px 0; border-bottom: 1px solid var(--border); font: 300 15px/1.2 var(--display); }
.links a:last-child { border-bottom: 0; }
.links a span { font: 300 10.5px/1.2 var(--mono); color: var(--muted); }
.links a:hover span { color: var(--accent); }

/* enlarged photo frame */
.zw .bar { cursor: default; }
.zx { margin-left: auto; border: 0; background: none; cursor: pointer; font: 300 12px/1 var(--mono); color: var(--muted); padding: 6px; }
.zx:hover { color: var(--ink); }
.zw .zbody { position: relative; padding: 10px; }
.zimg { flex: 1; position: relative; border-radius: 6px; overflow: hidden; }
.zimg img { object-fit: contain; background: var(--bg); }
.zcap { position: absolute; left: 12px; bottom: 10px; font: 300 11px/1.3 var(--mono); color: var(--ink); opacity: .8; background: color-mix(in srgb, var(--card) 80%, transparent); padding: 4px 8px; border-radius: 999px; }
.zn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink); background: var(--card); cursor: pointer; font: 300 16px/1 var(--mono); z-index: 2; }
.zn:hover { background: var(--ink); color: var(--bg); }
.zn.prev { left: 18px; } .zn.next { right: 18px; }

/* chrome */
#hint {
  position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 10; pointer-events: none;
  font: 300 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  transition: opacity .6s ease; animation: pulse 2.6s ease-in-out infinite; white-space: nowrap;
}
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
#toolbar {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .6s ease;
}
#toolbar.on { opacity: 1; pointer-events: auto; }
#toolbar button { font: 300 11px/1 var(--mono); padding: 9px 13px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }
#toolbar button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#toolbar .help { font: 300 10.5px/1 var(--mono); color: var(--muted); padding: 0 12px 0 8px; white-space: nowrap; }
@media (max-width: 640px) { #toolbar .help { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; animation: none !important; }
}
</style>

<div id="app">

      <svg id="lines" aria-hidden="true"></svg>

      <button type="button" id="home">overview</button>
      <span class="help">drag to pan &middot; ctrl + scroll to zoom</span>

  </div>
</div>

    hint.style.opacity = '0'; hint.style.animation = 'none';
    fly(overviewCam(), 1700);
    BRANCHES.forEach(function (b, i) {
      b.stem.style.transitionDelay = (.7 + i * .12) + 's';
      b.node.style.transitionDelay = (1.6 + i * .12) + 's';
      b.stem.classList.add('in'); b.node.classList.add('in'); b.node.inert = false;
    });
    setTimeout(function () {
      BRANCHES.forEach(function (b) { b.stem.style.transitionDelay = ''; b.node.style.transitionDelay = ''; });
    }, 4000);
    setTimeout(function () { toolbar.classList.add('on'); }, 2000);
  }
  nameEl.addEventListener('click', function () { if (phase === 'intro') begin(); else goHome(); });

  /* ---------- pan / zoom ---------- */
  var pan = null;
  vp.addEventListener('pointerdown', function (e) {
    if (phase !== 'map') return;
    if (e.target.closest('.win, .node, #name, #toolbar')) return;
    select(null); tween = null;
    pan = { id: e.pointerId, x: e.clientX, y: e.clientY };
    vp.setPointerCapture(e.pointerId); vp.classList.add('grabbing');
  });
  vp.addEventListener('pointermove', function (e) {
    if (!pan || e.pointerId !== pan.id) return;
    cam.x -= (e.clientX - pan.x) / cam.k; cam.y -= (e.clientY - pan.y) / cam.k;
    pan.x = e.clientX; pan.y = e.clientY; apply();
  });
  function endPan(e) { if (pan && e.pointerId === pan.id) { pan = null; vp.classList.remove('grabbing'); } }
  vp.addEventListener('pointerup', endPan); vp.addEventListener('pointercancel', endPan);
  vp.addEventListener('wheel', function (e) {
    if (phase !== 'map') return;
    e.preventDefault(); tween = null;
    if (e.ctrlKey || e.metaKey) {
      var r = vp.getBoundingClientRect();
      zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0025)));
    } else { cam.x += e.deltaX / cam.k; cam.y += e.deltaY / cam.k; apply(); }
  }, { passive: false });

  document.getElementById('zin').addEventListener('click', function () { fly({ x: cam.x, y: cam.y, k: clamp(cam.k * 1.3, .15, 2.2) }, 350); });
  document.getElementById('zout').addEventListener('click', function () { fly({ x: cam.x, y: cam.y, k: clamp(cam.k / 1.3, .15, 2.2) }, 350); });
  document.getElementById('home').addEventListener('click', goHome);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || phase !== 'map') return;
    if (zoomState) closeZoom(true); else goHome();
  });

  /* clicks inside windows: enlarge a photo, step through photos, jump to another window, copy email */
  world.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-zclose]'))) { closeZoom(true); return; }
    if ((el = t.closest('[data-zn]'))) {
      if (zoomState) { var n = zoomState.items.length; zoomState.idx = (zoomState.idx + (+el.getAttribute('data-zn')) + n) % n; paintZoom(zoomState); }
      return;
    }
    if ((el = t.closest('[data-zi]'))) {
      var host = el.closest('.win');
      if (host && host.__info) openZoom(host.__info, itemsOf(host.__info.w), +el.getAttribute('data-zi'));
      return;
    }
    if ((el = t.closest('[data-goto]'))) { gotoWin(el.getAttribute('data-goto')); return; }
    var btn = t.closest('[data-copy]');
    if (!btn) return;
    function fallback() {
      var m = document.getElementById('mailtext'), range = document.createRange();
      range.selectNodeContents(m); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = 'press ctrl/cmd + c';
    }
    try {
      navigator.clipboard.writeText(CONFIG.email).then(function () { btn.textContent = 'copied'; }, fallback);
    } catch (err) { fallback(); }
  });

  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>
