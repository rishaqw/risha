<title>Portfolio Mindmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Outfit:wght@200;300;400&display=swap">
<style>
/* Layout concept: an infinite off-white grid board. Name sits at the origin; click zooms the
   camera out, six flowing stems draw outward, each stem unfolds a zig-zag chain of frames. */
:root {
  --bg: #f3f2ee;
  --grid: #e8e6df;
  --grid-major: #dad7ce;
  --ink: #17171a;
  --muted: #74737a;
  --accent: #0c8ce9;
  --card: #fdfdfb;
  --border: #dedbd2;
  --line: #4a4950;
  --p0a: #d9e6f2; --p0b: #b9cfe6;
  --p1a: #f2ddd2; --p1b: #e5bfae;
  --p2a: #dbebd8; --p2b: #b9d5b4;
  --p3a: #e5dcf1; --p3b: #cbbbe3;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.06);
  --display: 'Outfit', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131317; --grid: #1b1b21; --grid-major: #282830; --ink: #f1f0ec; --muted: #9b9aa3;
    --accent: #4cb0ff; --card: #1c1c22; --border: #2f2f38; --line: #c4c3cb;
    --p0a: #26374a; --p0b: #34506b; --p1a: #4a3329; --p1b: #6b4838;
    --p2a: #2b4129; --p2b: #3d5e3a; --p3a: #3b2f49; --p3b: #54426a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131317; --grid: #1b1b21; --grid-major: #282830; --ink: #f1f0ec; --muted: #9b9aa3;
  --accent: #4cb0ff; --card: #1c1c22; --border: #2f2f38; --line: #c4c3cb;
  --p0a: #26374a; --p0b: #34506b; --p1a: #4a3329; --p1b: #6b4838;
  --p2a: #2b4129; --p2b: #3d5e3a; --p3a: #3b2f49; --p3b: #54426a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 300 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

#app { position: relative; height: 100%; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
}
#viewport.intro { cursor: default; }
#viewport.grabbing { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
#lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }

.stem, .conn {
  fill: none; stroke: var(--line); stroke-width: var(--sw, 1); stroke-linecap: butt;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset 1.2s cubic-bezier(.5, 0, .2, 1);
}
.stem.in, .conn.show { stroke-dashoffset: 0; }

#name {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 5;
  font: 200 60px/1 var(--display); letter-spacing: -.01em; white-space: nowrap;
  padding: 18px 40px 21px; border: 1px solid transparent; border-radius: 34px;
  background: transparent; color: var(--ink); cursor: pointer;
  transition: border-color .8s ease, background-color .8s ease;
}
#name.mapped { border-color: var(--ink); background: var(--bg); }

.node {
  position: absolute; z-index: 4; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
  font: 300 18px/1 var(--display); letter-spacing: .01em; white-space: nowrap;
  padding: 11px 23px 12px; border-radius: 999px; border: 1px solid var(--ink);
  background: var(--bg); color: var(--ink); cursor: pointer;
  transition: transform .7s cubic-bezier(.2, .9, .25, 1.1), opacity .5s ease, background-color .25s, color .25s;
}
.node.in { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.node.in:hover { transform: translate(-50%, -50%) scale(1.05); }
.node.open { background: var(--ink); color: var(--bg); }

.win {
  position: absolute; z-index: 3; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(.12);
  transition: transform .95s cubic-bezier(.2, .9, .25, 1), opacity .5s ease, box-shadow .2s ease;
}
.win.show { opacity: 1; transform: none; pointer-events: auto; }
.win:hover { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.win.sel { box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.win .h { position: absolute; width: 7px; height: 7px; background: var(--card); border: 1px solid var(--accent); display: none; }
.win.sel .h { display: block; }
.h.a { left: -4px; top: -4px; } .h.b { right: -4px; top: -4px; } .h.c { left: -4px; bottom: -4px; } .h.d { right: -4px; bottom: -4px; }
.win .inner { height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 9px; }
.win .bar {
  flex: none; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px;
  border-bottom: 1px solid var(--border); cursor: grab; user-select: none; touch-action: none;
  font: 300 10px/1 var(--mono); letter-spacing: .03em; color: var(--muted);
}
.win .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.win .bar span { margin-left: 6px; }
.win .body { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; user-select: text; cursor: auto; }

/* window content */
.grid { flex: 1; min-height: 0; display: grid; gap: 5px; }
.ph { position: relative; border-radius: 5px; overflow: hidden; margin: 0; min-height: 0; }
.ph.p0 { background: linear-gradient(135deg, var(--p0a), var(--p0b)); }
.ph.p1 { background: linear-gradient(135deg, var(--p1a), var(--p1b)); }
.ph.p2 { background: linear-gradient(135deg, var(--p2a), var(--p2b)); }
.ph.p3 { background: linear-gradient(135deg, var(--p3a), var(--p3b)); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph figcaption { position: absolute; left: 8px; bottom: 6px; font: 300 9.5px/1.2 var(--mono); color: var(--ink); opacity: .7; }
.video { flex: 1; display: grid; place-items: center; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; }
.play::after { content: ""; margin-left: 3px; border-left: 10px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.scrub { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 1px; background: color-mix(in srgb, var(--ink) 25%, transparent); }
.scrub i { display: block; width: 34%; height: 100%; background: var(--ink); }
.time { position: absolute; right: 10px; bottom: 16px; font: 300 9.5px/1 var(--mono); color: var(--ink); opacity: .7; }
.meta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex: none; }
.meta b { font: 400 14px/1.2 var(--display); }
.meta span { font: 300 10.5px/1.3 var(--mono); color: var(--muted); text-align: right; }
.posters { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.poster { border-radius: 3px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font: 300 22px/.95 var(--display); letter-spacing: -.02em; color: #17171a; }
.poster small { font: 400 8px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.swatches { display: flex; gap: 5px; flex: none; height: 60px; }
.swatches i { flex: 1; border-radius: 5px; }
.specimen { flex: 1; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); border-radius: 7px; padding: 0 16px; }
.specimen b { font: 200 64px/1 var(--display); }
.specimen div { font: 300 10.5px/1.6 var(--mono); color: var(--muted); }
.wire { flex: 1; display: grid; grid-template-columns: 70px 1fr; gap: 8px; min-height: 0; }
.wire > div { border: 1px dashed var(--border); border-radius: 5px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.wire i { display: block; height: 6px; border-radius: 3px; background: var(--border); }
.wire i.s { width: 60%; } .wire i.t { height: 34px; border-radius: 5px; background: linear-gradient(135deg, var(--p0a), var(--p0b)); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row b { font: 400 13px/1.3 var(--display); }
.row span { font: 300 10.5px/1.3 var(--mono); color: var(--muted); text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font: 300 10.5px/1 var(--mono); padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px; }
.log { font: 300 10.5px/1.8 var(--mono); color: var(--muted); }
.log b { color: var(--ink); font-weight: 400; }
.prose p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; }
.prose p:last-child { margin: 0; }
.kick { font: 300 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex: none; }
.ttl { font: 300 21px/1.15 var(--display); flex: none; }
.about-head { display: flex; gap: 12px; align-items: center; flex: none; }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--p1a), var(--p3b)); flex: none; }
.about-head b { display: block; font: 300 24px/1.1 var(--display); }
.about-head span { font: 300 10.5px/1.4 var(--mono); color: var(--muted); }
.mail { font: 300 24px/1.15 var(--display); overflow-wrap: anywhere; }
.copy { align-self: flex-start; font: 400 10.5px/1 var(--mono); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.copy:hover { background: var(--ink); color: var(--bg); }
.links a { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink); text-decoration: none; padding: 11px 0; border-bottom: 1px solid var(--border); font: 300 15px/1.2 var(--display); }
.links a:last-child { border-bottom: 0; }
.links a span { font: 300 10.5px/1.2 var(--mono); color: var(--muted); }
.links a:hover span { color: var(--accent); }

/* chrome */
#hint {
  position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 10; pointer-events: none;
  font: 300 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  transition: opacity .6s ease; animation: pulse 2.6s ease-in-out infinite; white-space: nowrap;
}
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
#toolbar {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .6s ease;
}
#toolbar.on { opacity: 1; pointer-events: auto; }
#toolbar button { font: 300 11px/1 var(--mono); padding: 9px 13px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }
#toolbar button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#toolbar .help { font: 300 10.5px/1 var(--mono); color: var(--muted); padding: 0 12px 0 8px; white-space: nowrap; }
@media (max-width: 640px) { #toolbar .help { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; animation: none !important; }
}
</style>

<div id="app">
  <div id="viewport" class="intro">
    <div id="world">
      <svg id="lines" aria-hidden="true"></svg>
      <button id="name" type="button" aria-label="Open portfolio map"></button>
    </div>
    <div id="hint">click to explore</div>
    <div id="toolbar" role="toolbar" aria-label="Map controls">
      <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="home">overview</button>
      <span class="help">drag to pan &middot; ctrl + scroll to zoom</span>
    </div>
  </div>
</div>

<script>
(function () {
  /* ---------- edit these ---------- */
  var CONFIG = {
    name: 'Risha',
    email: 'dm@risha.nz'
  };
  /* Photos: add src:'my-photo.jpg' to any tile. Every project / event is a gallery window
     followed by an info window (what it was, your role, gear). Copy a pair to add another. */
  var BRANCHES = [
    { id: 'photography', label: 'photography', angle: -150, wins: [
      { title: 'event 01 / gallery', w: 340, h: 280, type: 'grid', cols: 2, rows: 2,
        tiles: [{ cap: 'Crowd, wide' }, { cap: 'Stage, backlit' }, { cap: 'Backstage' }, { cap: 'Portrait' }] },
      { title: 'event 01 / the shoot', w: 300, h: 300, type: 'info', kick: 'event 01 · live night',
        head: 'Night at the venue',
        text: 'A short note on what the event was, who it was for, and what you were asked to capture.',
        rows: [['role', 'event photographer'], ['gear', 'mirrorless + 35mm prime'], ['light', 'available + one flash']] },
      { title: 'event 02 / gallery', w: 340, h: 280, type: 'grid', cols: 3, rows: 2,
        tiles: [{ cap: 'Frame 1' }, { cap: 'Frame 2' }, { cap: 'Frame 3' }, { cap: 'Frame 4' }, { cap: 'Frame 5' }, { cap: 'Frame 6' }] },
      { title: 'event 02 / the shoot', w: 300, h: 300, type: 'info', kick: 'event 02 · on film',
        head: 'Daytime on 35mm',
        text: 'Same idea, different kit. Describe the event, the look you were after and how the gear shaped it.',
        rows: [['role', 'photographer'], ['gear', '35mm film camera'], ['stock', 'colour negative, 400']] }
    ] },
    { id: 'videography', label: 'videography', angle: -90, wins: [
      { title: 'showreel 2026', w: 340, h: 270, type: 'video', time: '01:24', name: 'Showreel 2026', sub: 'direction · edit · grade' },
      { title: 'music video', w: 300, h: 250, type: 'video', time: '03:12', name: 'Music video', sub: 'edit · colour' },
      { title: 'short film', w: 300, h: 250, type: 'video', time: '07:40', name: 'Short film', sub: 'written · shot · cut' }
    ] },
    { id: 'design', label: 'design', angle: -30, wins: [
      { title: 'society rebrand / gallery', w: 340, h: 280, type: 'grid', cols: 2, rows: 2,
        tiles: [{ cap: 'Logo suite' }, { cap: 'Merch' }, { cap: 'Socials' }, { cap: 'Posters' }] },
      { title: 'society rebrand / about', w: 300, h: 300, type: 'info', kick: 'project 01 · uni society',
        head: 'Society rebrand',
        text: 'The story of the project: why the society needed a refresh, what changed, and how it landed.',
        rows: [['role', 'lead designer'], ['scope', 'identity · merch · socials'], ['team', 'exec committee']] },
      { title: 'event posters / gallery', w: 340, h: 280, type: 'posters' },
      { title: 'event posters / about', w: 300, h: 300, type: 'info', kick: 'project 02 · event series',
        head: 'Event poster series',
        text: 'What the events were, what the posters needed to do, and the system behind them.',
        rows: [['role', 'designer'], ['format', 'print + social'], ['year', '2026']] }
    ] },
    { id: 'tech', label: 'tech things', angle: 30, wins: [
      { title: 'projects', w: 340, h: 260, type: 'projects' },
      { title: 'stack', w: 300, h: 200, type: 'stack' },
      { title: 'build log', w: 320, h: 230, type: 'log' }
    ] },
    { id: 'about', label: 'about', angle: 90, wins: [
      { title: 'hello', w: 320, h: 290, type: 'about' },
      { title: 'currently', w: 300, h: 220, type: 'currently' }
    ] },
    { id: 'contact', label: 'contact', angle: 150, wins: [
      { title: 'say hello', w: 320, h: 240, type: 'mail' },
      { title: 'elsewhere', w: 300, h: 220, type: 'links' }
    ] }
  ];
  /* layout (tested for no overlaps) */
  var R = 400, D0 = 300, STEP = 240, OFF = 180;

  var vp = document.getElementById('viewport'), world = document.getElementById('world'),
      svg = document.getElementById('lines'), nameEl = document.getElementById('name'),
      hint = document.getElementById('hint'), toolbar = document.getElementById('toolbar');
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vw = 0, vh = 0, cam = { x: 0, y: 0, k: 1 }, phase = 'intro', tween = null, focusId = null, zTop = 10;

  nameEl.textContent = CONFIG.name;

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mk(tag, attrs) { var el = document.createElementNS(NS, tag); for (var k in attrs) el.setAttribute(k, attrs[k]); return el; }

  /* ---------- camera ---------- */
  function apply() {
    var ox = vw / 2 - cam.x * cam.k, oy = vh / 2 - cam.y * cam.k;
    world.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + cam.k + ')';
    world.style.setProperty('--sw', clamp(1.1 / cam.k, 1, 4).toFixed(2));
    var major = 200 * cam.k, fine = 40 * cam.k < 10 ? major : 40 * cam.k;
    vp.style.backgroundSize = major + 'px ' + major + 'px,' + major + 'px ' + major + 'px,' + fine + 'px ' + fine + 'px,' + fine + 'px ' + fine + 'px';
    vp.style.backgroundPosition = ox + 'px ' + oy + 'px';
  }
  function fly(t, ms) {
    var s = { x: cam.x, y: cam.y, k: cam.k }, start = performance.now(), id = {};
    if (reduce || !ms) { cam.x = t.x; cam.y = t.y; cam.k = t.k; tween = null; apply(); return; }
    tween = id;
    function step(now) {
      if (tween !== id) return;
      var p = Math.min(1, (now - start) / ms);
      var e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      cam.k = s.k * Math.pow(t.k / s.k, e);
      var f = Math.abs(1 / t.k - 1 / s.k) > 1e-6 ? (1 / cam.k - 1 / s.k) / (1 / t.k - 1 / s.k) : e;
      cam.x = s.x + (t.x - s.x) * f; cam.y = s.y + (t.y - s.y) * f;
      apply();
      if (p < 1) requestAnimationFrame(step); else tween = null;
    }
    step(start);
  }
  function overviewCam() { return { x: 0, y: 0, k: clamp(Math.min(vw / 960, vh / 1000), .18, 1) }; }
  function introCam() { return { x: 0, y: 0, k: clamp(vw * .8 / (nameEl.offsetWidth || 300), .2, 1) }; }
  function zoomAt(sx, sy, f) {
    var wx = (sx - vw / 2) / cam.k + cam.x, wy = (sy - vh / 2) / cam.k + cam.y;
    var k = clamp(cam.k * f, .15, 2.2);
    cam.x = wx - (sx - vw / 2) / k; cam.y = wy - (sy - vh / 2) / k; cam.k = k; apply();
  }
  function resize() {
    vw = vp.clientWidth; vh = vp.clientHeight;
    if (phase === 'intro') { var c = introCam(); cam.x = c.x; cam.y = c.y; cam.k = c.k; }
    apply();
  }

  /* ---------- window content ---------- */
  function render(w) {
    var t = w.type, h = '';
    if (t === 'grid') {
      h = '<div class="grid" style="grid-template-columns:repeat(' + w.cols + ',1fr);grid-template-rows:repeat(' + w.rows + ',1fr)">' +
        w.tiles.map(function (tl, i) {
          return '<figure class="ph p' + (i % 4) + '">' + (tl.src ? '<img src="' + esc(tl.src) + '" alt="' + esc(tl.cap) + '">' : '') + '<figcaption>' + esc(tl.cap) + '</figcaption></figure>';
        }).join('') + '</div>';
    } else if (t === 'info') {
      h = '<div class="kick">' + esc(w.kick) + '</div><div class="ttl">' + esc(w.head) + '</div>' +
        '<div class="prose"><p>' + esc(w.text) + '</p></div>' +
        '<div class="rows">' + w.rows.map(function (r) { return '<div class="row"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>'; }).join('') + '</div>';
    } else if (t === 'video') {
      h = '<div class="ph p1 video"><span class="play"></span><div class="scrub"><i></i></div><span class="time">' + esc(w.time) + '</span></div>' +
        '<div class="meta"><b>' + esc(w.name) + '</b><span>' + esc(w.sub) + '</span></div>';
    } else if (t === 'posters') {
      h = '<div class="posters">' +
        '<div class="poster" style="background:#f2c94c"><small>gig 07</small>LIVE<br>AT 9</div>' +
        '<div class="poster" style="background:#e8604c;color:#fdfdfb"><small>festival</small>NO<br>SIGNAL</div>' +
        '<div class="poster" style="background:#b9cfe6"><small>zine 02</small>SOFT<br>EDGES</div></div>';
    } else if (t === 'wire') {
      h = '<div class="wire"><div><i></i><i class="s"></i><i></i><i class="s"></i></div><div><i class="t"></i><i></i><i class="s"></i><i class="t"></i></div></div>';
    } else if (t === 'projects') {
      h = '<div class="rows">' +
        '<div class="row"><b>Generative poster tool</b><span>canvas · js</span></div>' +
        '<div class="row"><b>Live audio visualiser</b><span>web audio</span></div>' +
        '<div class="row"><b>Sensor-driven lamp</b><span>arduino</span></div>' +
        '<div class="row"><b>This portfolio</b><span>html · css · js</span></div></div>';
    } else if (t === 'stack') {
      h = '<div class="chips"><span>JavaScript</span><span>Python</span><span>HTML / CSS</span><span>Arduino</span><span>Processing</span><span>Figma</span><span>Blender</span><span>Git</span></div>';
    } else if (t === 'log') {
      h = '<div class="log"><b>&gt; v0.3</b> shipped the visualiser<br><b>&gt; v0.2</b> fixed the latency bug<br><b>&gt; v0.1</b> first sketch, kind of works<br><b>&gt; next</b> shaders, then docs</div>';
    } else if (t === 'about') {
      h = '<div class="about-head"><div class="avatar"></div><div><b>' + esc(CONFIG.name) + '</b><span>photographer · filmmaker · designer</span></div></div>' +
        '<div class="prose"><p>I shoot events, cut films, design identities for student societies, and build the occasional tool that does something odd.</p>' +
        '<p>Most of my work starts as a small curiosity and ends up as a series. Swap this for a few honest sentences in your own voice.</p></div>';
    } else if (t === 'currently') {
      h = '<div class="rows"><div class="row"><b>Shooting</b><span>35mm, weekends</span></div><div class="row"><b>Making</b><span>a short film</span></div><div class="row"><b>Learning</b><span>shaders</span></div><div class="row"><b>Listening</b><span>too much</span></div></div>';
    } else if (t === 'mail') {
      h = '<div class="prose"><p>Open to commissions, collaborations and strange ideas.</p></div>' +
        '<div class="mail" id="mailtext">' + esc(CONFIG.email) + '</div>' +
        '<button type="button" class="copy" data-copy>copy email</button>';
    } else if (t === 'links') {
      h = '<div class="links">' +
        '<a href="https://www.instagram.com/risqpl/" target="_blank" rel="noopener">Instagram <span>@risqpl</span></a>' +
        '<a href="https://www.instagram.com/rnfolio/" target="_blank" rel="noopener">Portfolio <span>@rnfolio</span></a></div>';
    }
    return h;
  }

  /* ---------- build the map ---------- */
  function stemPath(pos, i) {
    var len = Math.hypot(pos.x, pos.y), nx = -pos.y / len, ny = pos.x / len, bend = (i % 2 ? 1 : -1) * len * .2;
    var c1 = { x: pos.x * .35 + nx * bend, y: pos.y * .35 + ny * bend };
    var c2 = { x: pos.x * .68 - nx * bend, y: pos.y * .68 - ny * bend };
    return 'M0 0C' + c1.x + ' ' + c1.y + ' ' + c2.x + ' ' + c2.y + ' ' + pos.x + ' ' + pos.y;
  }
  function connPath(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) >= Math.abs(dy)) {
      return 'M' + a.x + ' ' + a.y + 'C' + (a.x + dx * .62) + ' ' + a.y + ' ' + (b.x - dx * .62) + ' ' + b.y + ' ' + b.x + ' ' + b.y;
    }
    return 'M' + a.x + ' ' + a.y + 'C' + a.x + ' ' + (a.y + dy * .62) + ' ' + b.x + ' ' + (b.y - dy * .62) + ' ' + b.x + ' ' + b.y;
  }
  function place(w) { w.el.style.left = (w.x - w.w / 2) + 'px'; w.el.style.top = (w.y - w.h / 2) + 'px'; }
  function parentPt(b, j) { return j === 0 ? b.pos : b.wins[j - 1]; }
  function updateConn(b, j) {
    var w = b.wins[j], p = parentPt(b, j);
    w.conn.setAttribute('d', connPath({ x: p.x, y: p.y }, { x: w.x, y: w.y }));
    w.el.style.setProperty('--fx', (p.x - w.x) + 'px');
    w.el.style.setProperty('--fy', (p.y - w.y) + 'px');
  }
  function select(w) {
    BRANCHES.forEach(function (b) { b.wins.forEach(function (o) { o.el.classList.remove('sel'); }); });
    if (w) { w.el.classList.add('sel'); w.el.style.zIndex = ++zTop; }
  }

  BRANCHES.forEach(function (b, bi) {
    var a = b.angle * Math.PI / 180, d = { x: Math.cos(a), y: Math.sin(a) }, p = { x: -d.y, y: d.x };
    b.pos = { x: R * d.x, y: R * d.y };
    b.stem = mk('path', { 'class': 'stem', pathLength: 1, d: stemPath(b.pos, bi) });
    svg.appendChild(b.stem);

    b.node = document.createElement('button');
    b.node.type = 'button'; b.node.className = 'node'; b.node.textContent = b.label; b.node.inert = true;
    b.node.setAttribute('aria-expanded', 'false');
    b.node.style.left = b.pos.x + 'px'; b.node.style.top = b.pos.y + 'px';
    world.appendChild(b.node);

    b.wins.forEach(function (w, j) {
      var s = (j % 2 ? 1 : -1) * OFF, dist = D0 + j * STEP;
      w.x = b.pos.x + d.x * dist + p.x * s; w.y = b.pos.y + d.y * dist + p.y * s;
      w.conn = mk('path', { 'class': 'conn', pathLength: 1 });
      svg.appendChild(w.conn);
      w.el = document.createElement('div');
      w.el.className = 'win'; w.el.inert = true;
      w.el.setAttribute('role', 'group'); w.el.setAttribute('aria-label', b.label + ': ' + w.title);
      w.el.style.width = w.w + 'px'; w.el.style.height = w.h + 'px';
      w.el.innerHTML = '<div class="inner"><div class="bar"><i></i><i></i><i></i><span>' + esc(b.label + ' / ' + w.title) + '</span></div><div class="body">' + render(w) + '</div></div><b class="h a"></b><b class="h b"></b><b class="h c"></b><b class="h d"></b>';
      world.appendChild(w.el);
      place(w);
    });
    b.wins.forEach(function (w, j) { updateConn(b, j); });

    b.node.addEventListener('click', function () { onNode(b); });
    b.wins.forEach(function (w, j) {
      var bar = w.el.querySelector('.bar'), drag = null;
      w.el.addEventListener('pointerdown', function () { select(w); });
      bar.addEventListener('pointerdown', function (e) {
        e.stopPropagation(); tween = null;
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
        bar.setPointerCapture(e.pointerId); bar.style.cursor = 'grabbing';
      });
      bar.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        w.x += (e.clientX - drag.x) / cam.k; w.y += (e.clientY - drag.y) / cam.k;
        drag.x = e.clientX; drag.y = e.clientY;
        place(w); updateConn(b, j); if (b.wins[j + 1]) updateConn(b, j + 1);
      });
      function end(e) { if (drag && e.pointerId === drag.id) { drag = null; bar.style.cursor = ''; } }
      bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
    });
  });

  /* ---------- open / close / focus ---------- */
  function branchBox(b) {
    var x0 = b.pos.x - 100, x1 = b.pos.x + 100, y0 = b.pos.y - 30, y1 = b.pos.y + 30;
    b.wins.forEach(function (w) {
      x0 = Math.min(x0, w.x - w.w / 2); x1 = Math.max(x1, w.x + w.w / 2);
      y0 = Math.min(y0, w.y - w.h / 2); y1 = Math.max(y1, w.y + w.h / 2);
    });
    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
  }
  function focusCam(b) {
    var bx = branchBox(b), pad = 90;
    return { x: bx.cx, y: bx.cy, k: clamp(Math.min(vw / (bx.w + pad * 2), vh / (bx.h + pad * 2)), .18, 1) };
  }
  function openBranch(b) {
    b.open = true; b.node.classList.add('open'); b.node.setAttribute('aria-expanded', 'true');
    b.wins.forEach(function (w, j) {
      w.conn.style.transitionDelay = (j * .22) + 's';
      w.el.style.transitionDelay = (.3 + j * .22) + 's';
      w.conn.classList.add('show'); w.el.classList.add('show'); w.el.inert = false;
    });
  }
  function closeBranch(b) {
    b.open = false; b.node.classList.remove('open'); b.node.setAttribute('aria-expanded', 'false');
    b.wins.forEach(function (w) {
      w.conn.style.transitionDelay = '0s'; w.el.style.transitionDelay = '0s';
      w.conn.classList.remove('show'); w.el.classList.remove('show'); w.el.classList.remove('sel'); w.el.inert = true;
    });
  }
  function onNode(b) {
    if (phase !== 'map') return;
    if (!b.open) { openBranch(b); focusId = b.id; fly(focusCam(b), 1400); }
    else if (focusId !== b.id) { focusId = b.id; fly(focusCam(b), 1100); }
    else { closeBranch(b); focusId = null; fly(overviewCam(), 1100); }
  }
  function goHome() { focusId = null; select(null); fly(overviewCam(), 1200); }

  function begin() {
    phase = 'map'; vp.classList.remove('intro');
    nameEl.classList.add('mapped'); nameEl.setAttribute('aria-label', CONFIG.name + ' — back to overview');
    hint.style.opacity = '0'; hint.style.animation = 'none';
    fly(overviewCam(), 1700);
    BRANCHES.forEach(function (b, i) {
      b.stem.style.transitionDelay = (.7 + i * .12) + 's';
      b.node.style.transitionDelay = (1.6 + i * .12) + 's';
      b.stem.classList.add('in'); b.node.classList.add('in'); b.node.inert = false;
    });
    setTimeout(function () {
      BRANCHES.forEach(function (b) { b.stem.style.transitionDelay = ''; b.node.style.transitionDelay = ''; });
    }, 4000);
    setTimeout(function () { toolbar.classList.add('on'); }, 2000);
  }
  nameEl.addEventListener('click', function () { if (phase === 'intro') begin(); else goHome(); });

  /* ---------- pan / zoom ---------- */
  var pan = null;
  vp.addEventListener('pointerdown', function (e) {
    if (phase !== 'map') return;
    if (e.target.closest('.win, .node, #name, #toolbar')) return;
    select(null); tween = null;
    pan = { id: e.pointerId, x: e.clientX, y: e.clientY };
    vp.setPointerCapture(e.pointerId); vp.classList.add('grabbing');
  });
  vp.addEventListener('pointermove', function (e) {
    if (!pan || e.pointerId !== pan.id) return;
    cam.x -= (e.clientX - pan.x) / cam.k; cam.y -= (e.clientY - pan.y) / cam.k;
    pan.x = e.clientX; pan.y = e.clientY; apply();
  });
  function endPan(e) { if (pan && e.pointerId === pan.id) { pan = null; vp.classList.remove('grabbing'); } }
  vp.addEventListener('pointerup', endPan); vp.addEventListener('pointercancel', endPan);
  vp.addEventListener('wheel', function (e) {
    if (phase !== 'map') return;
    e.preventDefault(); tween = null;
    if (e.ctrlKey || e.metaKey) {
      var r = vp.getBoundingClientRect();
      zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0025)));
    } else { cam.x += e.deltaX / cam.k; cam.y += e.deltaY / cam.k; apply(); }
  }, { passive: false });

  document.getElementById('zin').addEventListener('click', function () { fly({ x: cam.x, y: cam.y, k: clamp(cam.k * 1.3, .15, 2.2) }, 350); });
  document.getElementById('zout').addEventListener('click', function () { fly({ x: cam.x, y: cam.y, k: clamp(cam.k / 1.3, .15, 2.2) }, 350); });
  document.getElementById('home').addEventListener('click', goHome);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && phase === 'map') goHome(); });

  /* copy email */
  world.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-copy]');
    if (!btn) return;
    function fallback() {
      var el = document.getElementById('mailtext'), range = document.createRange();
      range.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = 'press ctrl/cmd + c';
    }
    try {
      navigator.clipboard.writeText(CONFIG.email).then(function () { btn.textContent = 'copied'; }, fallback);
    } catch (err) { fallback(); }
  });

  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>
